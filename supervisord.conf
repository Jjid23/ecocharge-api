[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:dotnet]
command=dotnet SmartEVCharging.API.dll
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=ASPNETCORE_HTTP_PORTS="8080",ASPNETCORE_ENVIRONMENT="Production"

[program:yolo]
command=python3 /yolo/main.py
directory=/yolo
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="8000"
